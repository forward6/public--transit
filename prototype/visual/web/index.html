<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ottawa Transit Commissioner — visual prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="node_modules/maplibre-gl/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="node_modules/@fontsource-variable/inter/index.css" />
  <link rel="stylesheet" href="node_modules/@fontsource/source-serif-4/400.css" />
  <link rel="stylesheet" href="node_modules/@fontsource/source-serif-4/400-italic.css" />
  <link rel="stylesheet" href="node_modules/@fontsource/source-serif-4/600.css" />
  <link rel="stylesheet" href="node_modules/@fontsource/source-serif-4/600-italic.css" />
  <link rel="stylesheet" href="hud.css" />
  <script src="node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="map"></div>
  <canvas id="snow"></canvas>
  <div id="labels"></div>
  <div id="vignette"></div>

  <header id="topbar" class="glass"></header>
  <nav id="rail" class="glass"></nav>
  <aside id="left" class="glass panel"></aside>
  <aside id="right" class="glass panel"></aside>
  <div id="toast" class="glass" hidden></div>
  <section id="news" class="glass"></section>
  <section id="timeline" class="glass"></section>
  <section id="legend" class="glass"></section>
  <div id="attrib"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
