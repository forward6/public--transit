[project]
name = "otc-pipeline"
version = "0.1.0"
description = "Data pipeline for Ottawa Transit Commissioner: builds the December-2010 Ottawa–Gatineau base map"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=17",
  "shapely>=2.0",
  "numpy>=1.26",
  "mapbox-vector-tile>=2.1",
  "pmtiles>=3.4",
  "rasterio>=1.4",
  "pillow>=10",
  "freetype-py>=2.4",
  "fonttools[woff]>=4.50",
]

[project.scripts]
otc-pipeline = "otc_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
